<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient resembling card -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#709AC6" />
      <stop offset="70%" stop-color="#648FB9" />
      <stop offset="100%" stop-color="#5B86B0" />
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ABC8DF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#BBD5E8" stop-opacity="0.75" />
    </linearGradient>

    <!-- Sparkle Elements -->
    <g id="sparkle-star-white">
      <path d="M 0,-12 Q 0,0 12,0 Q 0,0 0,12 Q 0,0 -12,0 Q 0,0 0,-12 Z" fill="#FFFFFF" />
    </g>
    <g id="sparkle-star-subtle">
      <path d="M 0,-8 Q 0,0 8,0 Q 0,0 0,8 Q 0,0 -8,0 Q 0,0 0,-8 Z" fill="#FFFFFF" opacity="0.65" />
    </g>
  </defs>

  <!-- Background Card Base -->
  <rect width="600" height="400" rx="16" fill="url(#cardBg)" />

  <!-- Soft Zen Decorative Water Bubbles -->
  <circle cx="25" cy="290" r="32" fill="#FFFFFF" opacity="0.18" />
  <circle cx="95" cy="360" r="48" fill="#FFFFFF" opacity="0.30" />
  <circle cx="395" cy="330" r="26" fill="#FFFFFF" opacity="0.32" />
  <circle cx="430" cy="355" r="22" fill="#4C749C" opacity="0.25" />
  <circle cx="525" cy="275" r="9" fill="#FFFFFF" opacity="0.45" />
  <circle cx="585" cy="265" r="35" fill="#FFFFFF" opacity="0.25" />

  <!-- Bottom Soft Wave Curve -->
  <path d="M 0,335 C 180,315 360,345 600,305 L 600,400 L 0,400 Z" fill="url(#waveBg)" />

  <!-- Bottom Accent Sparkles -->
  <use href="#sparkle-star-white" x="58" y="305" transform="scale(0.8)" />
  <use href="#sparkle-star-subtle" x="286" y="338" />
  <use href="#sparkle-star-white" x="552" y="325" />

  <!-- BRAND NAME "Cleanzen" (Serif Typography) -->
  <text x="300" y="82" 
        text-anchor="middle" 
        font-family="'Playfair Display', 'Cormorant Garamond', 'Georgia', serif" 
        font-size="52" 
        font-weight="500" 
        letter-spacing="1.5" 
        fill="#FFFFFF">Cleanzen</text>

  <!-- ZEN MEDITATOR ICON (CENTER) -->
  <g transform="translate(150, 40)">
    <!-- Sparkles around the meditating figure -->
    <use href="#sparkle-star-white" x="85" y="105" transform="scale(0.85) translate(10, 10)" />
    <use href="#sparkle-star-subtle" x="66" y="125" />
    <use href="#sparkle-star-white" x="220" y="105" transform="scale(0.85) translate(-10, 10)" />
    <use href="#sparkle-star-subtle" x="242" y="132" />

    <!-- Meditator Figure -->
    <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
      <!-- Halo Top Arch -->
      <path d="M 134,98 C 134,84 166,84 166,98" stroke-width="7" />
      <!-- Head -->
      <circle cx="150" cy="116" r="15" fill="#FFFFFF" stroke="none" />
      <!-- Arms -->
      <path d="M 104,160 L 104,170 C 104,185 125,187 142,176 C 146,174 154,174 158,176 C 175,187 196,185 196,170 L 196,160" stroke-width="8" />
      <path d="M 121,166 C 130,148 140,143 150,143 C 160,143 170,148 179,166" stroke-width="8" />

      <!-- Lotus Legs -->
      <path d="M 150,190 C 127,178 92,196 111,217 C 125,233 147,213 150,202 Z" fill="#FFFFFF" stroke="none" />
      <path d="M 150,190 C 173,178 208,196 189,217 C 175,233 153,213 150,202 Z" fill="#FFFFFF" stroke="none" />
      <path d="M 127,208 C 140,219 160,219 173,208" stroke-width="5" stroke="#648FB9" />

      <!-- Left Hand Tool: Duster Brush -->
      <g transform="translate(104, 148)">
        <line x1="0" y1="12" x2="0" y2="-10" stroke-width="7" stroke="#FFFFFF" />
        <path d="M -16,-10 L 16,-10 L 13,-17 L -13,-17 Z" fill="#FFFFFF" stroke="none" />
        <path d="M -13,-17 C -13,-28 -8,-34 -10,-38 L -3,-38 L -2,-17 M -2,-17 C -1,-34 2,-34 3,-17 M 3,-17 L 4,-38 L 11,-38 C 9,-34 13,-28 13,-17 Z" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="1.8" />
      </g>

      <!-- Right Hand Tool: Window Wiper / Squeegee -->
      <g transform="translate(196, 148)">
        <line x1="0" y1="12" x2="0" y2="-12" stroke-width="7" stroke="#FFFFFF" />
        <rect x="-20" y="-18" width="40" height="6" rx="2" fill="#FFFFFF" stroke="none" />
        <rect x="-18" y="-21" width="36" height="3" rx="1.5" fill="#FFFFFF" opacity="0.8" stroke="none" />
      </g>
    </g>
  </g>

  <!-- TAGLINE "CLEAN SPACE, CALM MIND" -->
  <text x="300" y="280" 
        text-anchor="middle" 
        font-family="'Plus Jakarta Sans', 'Outfit', 'Inter', sans-serif" 
        font-size="19" 
        font-weight="600" 
        letter-spacing="5" 
        fill="#FFFFFF" 
        opacity="0.95">CLEAN SPACE, CALM MIND</text>
</svg>
